[project]
name = "debate_system"
version = "0.1.0"
description = "debate-system using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.9.2"
]

[project.scripts]
debate_system = "debate_system.main:run"
run_crew = "debate_system.main:run"
train = "debate_system.main:train"
replay = "debate_system.main:replay"
test = "debate_system.main:test"
run_with_trigger = "debate_system.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
